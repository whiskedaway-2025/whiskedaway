    <h2>Our Story</h2>
    <p>Whisked Away is a home-baked adventure created and owned by 13-year-old Rainer. Started in April 2025 as small party cakes and treats, the stall grew—our first major event was the Burghead Craft Fair in June 2025. We focus on seasonal flavours, sensible portions, and honest ingredients.</p>

   <h2>Burghead Coffee Morning June 2026</h2>
<p>About the event:</p>
<p>Whisked Away is back! We'll be doing a coffee morning at <b> The Burghead Community Hall</b> from <b>08:30-11:30</b> on the <b>28th of June, 2026!</b>!</p>
<p>You can pre-book tickets to guarentee your spot by emailing <b>rainerc12@outlook.com</b> for just £6 each, or book a table of 6 for £35.</p>
<p>Your ticket will include, unlimted tea/coffee (dairy-free and decafe will be available) as well as a Whisked Away &copy; bake! There will also be a Take home/Top up stand where you can buy more Whisked Away goodies</p> 

















<h3>Values</h3>
    <ul>
      <li>Fresh, simple recipes</li>
      <li>Clear allergen info</li>
      <li>Friendly and reliable service</li>
    </ul>

    <h3>Events & Booking</h3>
    <p>We accept event bookings (minimum 28 days notice where possible). For larger orders, email with date, guest number, and basic design idea.</p>
    <p class="kicker">Tip: include a contact email when you use the Build a Cake form — it makes replies faster.</p>
